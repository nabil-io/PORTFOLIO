{% extends 'dashboard/base_dashboard.html' %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8">
    <div>
        <h1 class="text-3xl font-black text-white">Paramètres & Design System</h1>
        <p class="text-slate-400 text-sm mt-1">Personnalisez l'intégralité du contenu, des couleurs, des polices et des effets du site.</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="glow-box p-8 rounded-2xl bg-slate-900/80 backdrop-blur space-y-8">
        {% csrf_token %}

        <!-- Apparence & Design System -->
        <div>
            <h3 class="text-xl font-bold text-cyan-400 mb-4 flex items-center gap-2"><i class="fas fa-palette"></i> Apparence & Design System</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Couleur Primaire (Hex)</label>
                    <div class="flex items-center gap-2">
                        <input type="color" name="primary_color" value="{{ settings.primary_color }}" class="w-12 h-12 rounded-xl bg-slate-950 border border-white/10 cursor-pointer">
                        <input type="text" name="primary_color" value="{{ settings.primary_color }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none font-mono">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Couleur Secondaire (Hex)</label>
                    <div class="flex items-center gap-2">
                        <input type="color" name="secondary_color" value="{{ settings.secondary_color }}" class="w-12 h-12 rounded-xl bg-slate-950 border border-white/10 cursor-pointer">
                        <input type="text" name="secondary_color" value="{{ settings.secondary_color }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none font-mono">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Couleur de Fond (Hex)</label>
                    <div class="flex items-center gap-2">
                        <input type="color" name="bg_color" value="{{ settings.bg_color }}" class="w-12 h-12 rounded-xl bg-slate-950 border border-white/10 cursor-pointer">
                        <input type="text" name="bg_color" value="{{ settings.bg_color }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none font-mono">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Police d'écriture (Google Fonts)</label>
                    <select name="font_family" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                        <option value="Space Grotesk" {% if settings.font_family == 'Space Grotesk' %}selected{% endif %}>Space Grotesk</option>
                        <option value="Outfit" {% if settings.font_family == 'Outfit' %}selected{% endif %}>Outfit</option>
                        <option value="Rajdhani" {% if settings.font_family == 'Rajdhani' %}selected{% endif %}>Rajdhani</option>
                        <option value="Inter" {% if settings.font_family == 'Inter' %}selected{% endif %}>Inter</option>
                    </select>
                </div>
                <div class="flex items-center pt-6">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" name="enable_3d" {% if settings.enable_3d %}checked{% endif %} class="w-5 h-5 rounded bg-slate-950 border-white/10 text-cyan-400 focus:ring-0">
                        <span class="text-sm font-medium text-white">Activer les animations 3D Three.js</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Contenu Hero & Accueil -->
        <div class="border-t border-white/10 pt-8">
            <h3 class="text-xl font-bold text-cyan-400 mb-4 flex items-center gap-2"><i class="fas fa-home"></i> Section Hero & Identité</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Titre du site (SEO)</label>
                    <input type="text" name="site_title" value="{{ settings.site_title }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Badge d'accroche / Disponibilité</label>
                    <input type="text" name="availability" value="{{ settings.availability }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Salutation Hero</label>
                    <input type="text" name="hero_greeting" value="{{ settings.hero_greeting }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Nom Complet</label>
                    <input type="text" name="hero_title" value="{{ settings.hero_title }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-mono text-slate-400 mb-2">Sous-titre / Poste</label>
                    <input type="text" name="hero_subtitle" value="{{ settings.hero_subtitle }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-mono text-slate-400 mb-2">Phrase d'accroche principale (Hero Description)</label>
                    <textarea name="hero_description" rows="3" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">{{ settings.hero_description }}</textarea>
                </div>
            </div>
        </div>

        <!-- À propos & Contact -->
        <div class="border-t border-white/10 pt-8">
            <h3 class="text-xl font-bold text-cyan-400 mb-4 flex items-center gap-2"><i class="fas fa-address-card"></i> À propos & Coordonnées</h3>
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-2">Texte "À propos"</label>
                    <textarea name="about_text" rows="4" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">{{ settings.about_text }}</textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-2">Localisation</label>
                        <input type="text" name="location" value="{{ settings.location }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-2">Email</label>
                        <input type="email" name="email" value="{{ settings.email }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-2">Téléphone</label>
                        <input type="text" name="phone" value="{{ settings.phone }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-400 to-purple-600 text-slate-950 font-bold text-base hover:shadow-[0_0_25px_#00f0ff] transition">
            Enregistrer toutes les modifications
        </button>
    </form>
</div>
{% endblock %}

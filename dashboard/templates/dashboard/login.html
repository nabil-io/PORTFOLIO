<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Espace Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #06070d; color: #e2e8f0; }
        .glow-box { box-shadow: 0 0 30px rgba(0, 240, 255, 0.15); border: 1px solid rgba(0, 240, 255, 0.3); }
    </style>
</head>
<body class="h-full flex items-center justify-center p-6">
    <div class="max-w-md w-full glow-box p-8 rounded-2xl bg-slate-900/90 backdrop-blur">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-2xl mx-auto mb-4">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="text-2xl font-black text-white">Espace Administrateur</h1>
            <p class="text-xs font-mono text-cyan-400 mt-1">Personnalisation totale du portfolio</p>
        </div>

        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div class="p-3 rounded-lg border border-red-500/50 bg-red-500/10 text-red-300 text-sm text-center">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-mono text-slate-400 mb-2">Nom d'utilisateur</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-xs font-mono text-slate-400 mb-2">Mot de passe</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none transition">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-400 to-purple-600 text-slate-950 font-bold hover:shadow-[0_0_20px_#00f0ff] transition">
                Se connecter
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="{% url 'portfolio:home' %}" class="text-xs text-slate-400 hover:text-cyan-400 transition flex items-center justify-center gap-1">
                <i class="fas fa-arrow-left"></i> Retour au site public
            </a>
        </div>
    </div>
</body>
</html>

{% extends 'dashboard/base_dashboard.html' %}

{% block content %}
<div class="max-w-xl mx-auto space-y-8">
    <div>
        <h1 class="text-3xl font-black text-white">{{ action }} une Expérience</h1>
        <p class="text-slate-400 text-sm mt-1">Détails de l'expérience professionnelle.</p>
    </div>

    <form method="POST" class="glow-box p-8 rounded-2xl bg-slate-900/80 backdrop-blur space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-mono text-slate-400 mb-2">Titre du Poste</label>
            <input type="text" name="title" value="{{ experience.title }}" required class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
        </div>

        <div>
            <label class="block text-xs font-mono text-slate-400 mb-2">Entreprise / Organisation</label>
            <input type="text" name="company" value="{{ experience.company }}" required class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
        </div>

        <div>
            <label class="block text-xs font-mono text-slate-400 mb-2">Localisation</label>
            <input type="text" name="location" value="{{ experience.location|default:'Parakou, Bénin' }}" required class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-mono text-slate-400 mb-2">Date de début</label>
                <input type="text" name="start_date" value="{{ experience.start_date }}" required placeholder="ex: 2025" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-mono text-slate-400 mb-2">Date de fin</label>
                <input type="text" name="end_date" value="{{ experience.end_date|default:'Présent' }}" required class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-mono text-slate-400 mb-2">Description des missions et réalisations</label>
            <textarea name="description" rows="4" required class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">{{ experience.description }}</textarea>
        </div>

        <div>
            <label class="block text-xs font-mono text-slate-400 mb-2">Ordre d'affichage</label>
            <input type="number" name="order" value="{{ experience.order|default:0 }}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-cyan-400 focus:outline-none">
        </div>

        <div class="flex items-center justify-between pt-4">
            <a href="{% url 'dashboard:experience_list' %}" class="text-slate-400 hover:text-white text-sm">Annuler</a>
            <button type="submit" class="px-8 py-3.5 rounded-xl bg-gradient-to-r from-cyan-400 to-purple-600 text-slate-950 font-bold hover:shadow-[0_0_20px_#00f0ff] transition">
                Enregistrer
            </button>
        </div>
    </form>
</div>
{% endblock %}
